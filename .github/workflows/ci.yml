name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  mock-simulator:
    name: Test · mock simulator browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Test domain helpers
        run: pnpm --filter @openride/domain test

      - name: Test simulator in Chromium
        run: pnpm test:dev-hub

  db-migrations:
    name: DB · migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openride_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d openride_ci -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated nologin; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role nologin bypassrls; end if;
          end $$;
          create schema if not exists auth;
          create table if not exists auth.users (
            id uuid primary key,
            phone text,
            email text,
            raw_user_meta_data jsonb
          );
          create or replace function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          create or replace function auth.role() returns text language sql stable as $$
            select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), current_user::text);
          $$;
          do $$
          begin
            if not exists (select 1 from pg_publication where pubname = 'supabase_realtime') then
              create publication supabase_realtime;
            end if;
          end $$;
          SQL
          for f in infra/supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d openride_ci -v ON_ERROR_STOP=1 -f "$f"
          done

  rls-security:
    name: Security · RLS suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase (migrations + seed)
        run: supabase start --workdir infra

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run RLS suite
        run: |
          export SUPABASE_URL="$(supabase status --workdir infra -o env | grep '^API_URL' | cut -d= -f2 | tr -d '\"')"
          export SUPABASE_ANON_KEY="$(supabase status --workdir infra -o env | grep '^ANON_KEY' | cut -d= -f2 | tr -d '\"')"
          export SUPABASE_SERVICE_ROLE_KEY="$(supabase status --workdir infra -o env | grep '^SERVICE_ROLE_KEY' | cut -d= -f2 | tr -d '\"')"
          pnpm --filter @openride/testing test

      - name: Stop Supabase
        if: always()
        run: supabase stop --workdir infra --no-backup
